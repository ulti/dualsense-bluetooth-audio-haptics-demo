<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DualSense Bluetooth Audio & Haptics Demo</title>
  <style>
    :root {
      --bg-color: #0f111a;
      --card-bg: #1a1d2e;
      --card-border: #282c45;
      --text-main: #f0f2f5;
      --text-sub: #9499b3;
      --accent: #5b73e8;
      --accent-hover: #4861d8;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --haptic: #ec4899;
      --haptic-hover: #db2777;
      --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 30px 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 1.8rem;
      color: #ffffff;
      margin-bottom: 8px;
    }

    p.subtitle {
      color: var(--text-sub);
      font-size: 0.95rem;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: center;
    }

    .btn {
      padding: 10px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary {
      background-color: var(--accent);
      color: #fff;
    }
    .btn-primary:hover:not(:disabled) {
      background-color: var(--accent-hover);
    }

    .btn-danger {
      background-color: var(--danger);
      color: #fff;
    }
    .btn-danger:hover:not(:disabled) {
      background-color: #dc2626;
    }

    .btn-success {
      background-color: var(--success);
      color: #fff;
    }
    .btn-success:hover:not(:disabled) {
      background-color: #059669;
    }

    .btn-secondary {
      background-color: #2d334d;
      color: var(--text-main);
    }
    .btn-secondary:hover:not(:disabled) {
      background-color: #383f60;
    }

    .btn-haptic {
      background-color: var(--haptic);
      color: #fff;
    }
    .btn-haptic:hover:not(:disabled) {
      background-color: var(--haptic-hover);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 500;
      background-color: #222638;
      border: 1px solid var(--card-border);
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: var(--danger);
    }

    .status-badge.connected .status-dot {
      background-color: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-top: 15px;
    }

    .metric-box {
      background-color: #121422;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }

    .metric-label {
      font-size: 0.75rem;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .metric-value {
      font-size: 1.3rem;
      font-weight: 700;
      color: #fff;
      font-family: var(--font-mono);
    }

    .color-preview-box {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      border: 2px solid #fff;
      box-shadow: 0 0 12px rgba(255,255,255,0.2);
      transition: background-color 0.3s ease;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 140px;
    }

    .control-label {
      font-size: 0.8rem;
      color: var(--text-sub);
      font-weight: 500;
    }

    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 48px;
      height: 38px;
      border-radius: 6px;
      cursor: pointer;
      background: transparent;
    }

    input[type="range"] {
      accent-color: var(--accent);
      cursor: pointer;
    }

    select, input[type="number"] {
      background-color: #121422;
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
    }

    #console-log {
      width: 100%;
      height: 220px;
      background-color: #0b0d14;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: #38ef7d;
      font-family: var(--font-mono);
      font-size: 0.82rem;
      padding: 12px;
      resize: vertical;
      overflow-y: auto;
      white-space: pre;
      line-height: 1.4;
    }

    .pulse {
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { box-shadow: 0 0 4px var(--accent); }
      to { box-shadow: 0 0 16px var(--accent); }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>DualSense Bluetooth Audio & Haptics Demo</h1>
    </header>

    <!-- Connection Section -->
    <div class="card">
      <div class="card-title">
        <span>Connection</span>
        <div id="connection-status" class="status-badge">
          <div class="status-dot"></div>
          <span id="status-text">Disconnected</span>
        </div>
      </div>
      <div class="row" style="margin-bottom: 15px;">
        <button id="connect-btn" class="btn btn-primary">Connect DualSense</button>
        <button id="disconnect-btn" class="btn btn-danger" disabled>Disconnect</button>
        <span id="encoder-status" style="font-size: 0.85rem; color: var(--text-sub);">Loading libopus-wasm...</span>
      </div>

      <div class="row">
        <div class="color-preview-box" id="current-color-preview" style="background-color: #000000;" title="Current Target Color"></div>
        <div style="display: flex; flex-direction: column; justify-content: center;">
          <span style="font-size: 0.85rem; font-weight: 600;" id="color-name-text">Color: Idle</span>
        </div>
      </div>
    </div>

    <!-- Audio-Driven HD Waveform Haptics Section -->
    <div class="card" style="border-color: var(--haptic);">
      <div class="card-title">
        <span>Audio and Haptics</span>
      </div>

      <div class="row" style="margin-bottom: 15px;">
        <button id="toggle-audio-btn" class="btn btn-success" disabled>▶ Start MP3</button>

        <div class="control-group">
          <span class="control-label">Load Custom MP3</span>
          <input type="file" id="mp3-file-input" accept="audio/mp3, audio/mpeg" />
        </div>
      </div>

      <div class="row" style="margin-bottom: 15px;">
        <button id="toggle-sound-btn" class="btn btn-haptic">🔊 Sound on</button>

        <div class="control-group">
          <span class="control-label">Output select</span>
          <select id="audio-target-select">
            <option value="speaker" selected>Speaker</option>
            <option value="headset">Headset</option>
          </select>
        </div>

        <div class="control-group">
          <span class="control-label">Volume: <span id="volume-val">100</span>%</span>
          <input type="range" id="volume-slider" min="0" max="100" value="100">
        </div>
      </div>

      <div class="row" style="margin-bottom: 15px;">
        <button id="toggle-haptic-btn" class="btn btn-haptic">🌶️ Haptics on</button>

        <div class="control-group">
          <span class="control-label">Intensity: <span id="haptic-amp-val">100</span>%</span>
          <input type="range" id="haptic-amp-slider" min="0" max="100" step="5" value="100">
        </div>
      </div>

      <div class="metrics-grid">
        <div class="metric-box">
          <div class="metric-label">Audio Reports (0x39)</div>
          <div class="metric-value" id="metric-audio-sent">0</div>
        </div>
        <div class="metric-box">
          <div class="metric-label">Average Interval</div>
          <div class="metric-value" id="metric-interval">0.0 ms</div>
        </div>
      </div>
    </div>

    <!-- Diagnostic Log Console -->
    <div class="card">
      <div class="card-title">
        <span>Log</span>
        <button id="clear-log-btn" class="btn btn-secondary" style="padding: 4px 10px; font-size: 0.75rem;">Clear</button>
      </div>
      <textarea id="console-log" readonly placeholder="Diagnostic logs will appear here..."></textarea>
    </div>
  </div>

  <script type="module">
    import { createEncoder } from 'https://cdn.jsdelivr.net/npm/libopus-wasm/+esm';

    // --- Sony DualSense CRC32 Implementation ---
    const CRC32_TABLE = new Uint32Array(256);
    for (let i = 0; i < 256; i++) {
      let c = i;
      for (let bit = 0; bit < 8; bit++) {
        c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      }
      CRC32_TABLE[i] = c >>> 0;
    }

    function sonyCrc32(data) {
      let crc = ~0xEADA2D49 >>> 0; // 0x1525D2B6
      for (let i = 0; i < data.length; i++) {
        crc = (crc >>> 8) ^ CRC32_TABLE[(crc ^ data[i]) & 0xFF];
      }
      return (~crc) >>> 0;
    }

    function fillSonyCrc(report) {
      const crc = sonyCrc32(report.subarray(0, report.length - 4));
      const view = new DataView(report.buffer, report.byteOffset, report.byteLength);
      view.setUint32(report.length - 4, crc, true); // Little-endian
      return crc;
    }

    // --- Resample Stereo Linear (1024 frames -> 960 frames) ---
    function resampleStereoLinear(input, inputFrames, output, outputFrames) {
      const step = inputFrames / outputFrames; // 1024 / 960 = 1.06666667
      for (let outputFrame = 0; outputFrame < outputFrames; outputFrame++) {
        const sourcePosition = outputFrame * step;
        const sourceFrame = Math.floor(sourcePosition);
        const fraction = sourcePosition - sourceFrame;
        const nextFrame = Math.min(sourceFrame + 1, inputFrames - 1);

        const sourceOffset = sourceFrame * 2;
        const nextOffset = nextFrame * 2;
        const outputOffset = outputFrame * 2;

        output[outputOffset] = input[sourceOffset] + (input[nextOffset] - input[sourceOffset]) * fraction;
        output[outputOffset + 1] = input[sourceOffset + 1] + (input[nextOffset + 1] - input[sourceOffset + 1]) * fraction;
      }
    }

    // --- AudioWorklet Processor Source ---
    const audioWorkletCode = `
      class DualSenseAudioProcessor extends AudioWorkletProcessor {
        constructor(options) {
          super();
          this.targetFrames = 1024;
          this.samplesAccumulated = 0;
          this.bufferL = new Float32Array(1024);
          this.bufferR = new Float32Array(1024);
          this.active = true;

          this.customPcm = null;
          this.customIndex = 0;

          this.port.onmessage = (e) => {
            if (e.data.action === 'setCustomAudio') {
              this.customPcm = e.data.pcm; // Interleaved Float32Array
              this.customIndex = 0;
            } else if (e.data.action === 'stop') {
              this.active = false;
            }
          };
        }

        process(inputs, outputs, parameters) {
          if (!this.active) return false;

          const phaseIncrement = (2.0 * Math.PI * this.frequency) / 48000;

          for (let i = 0; i < 128; i++) {
            let sampleL = 0;
            let sampleR = 0;

            if (this.customPcm && this.customIndex < this.customPcm.length) {
              sampleL = this.customPcm[this.customIndex] * 0.1;       // Left
              sampleR = this.customPcm[this.customIndex + 1] * 0.1;   // Right
              this.customIndex += 2;
              // Loop back to start if end of track reached
              if (this.customIndex >= this.customPcm.length) {
                this.customIndex = 0;
              }
            }

            this.bufferL[this.samplesAccumulated] = sampleL;
            this.bufferR[this.samplesAccumulated] = sampleR;
            this.samplesAccumulated++;

            if (this.samplesAccumulated === 1024) {
              const frames = 1024 * 2;
              const pcm = new Float32Array(frames);
              for (let s = 0; s < frames; s++) {
                pcm[s * 2] = this.bufferL[s];
                pcm[s * 2 + 1] = this.bufferR[s];
              }
              this.port.postMessage({type: 'audio-chunk', pcm, frames}, [pcm.buffer]);
              this.samplesAccumulated = 0;
            }
          }
          return true;
        }
      }
      registerProcessor('dualsense-audio-processor', DualSenseAudioProcessor);
    `;

    // --- Protocol Constants & State ---
    const SAMPLE_RATE = 48000;
    const CHANNELS = 2;
    const FRAMES_PER_OPUS_PACKET = 480;
    const SAMPLES_PER_OPUS_PACKET = FRAMES_PER_OPUS_PACKET * CHANNELS;
    const OPUS_PACKET_BYTES = 200;
    const FULL_REPORT_LENGTH = 547;
    const STATE_REPORT_LENGTH = 142;

    let hidDevice = null;
    let encoder = null;
    let audioContext = null;
    let workletNode = null;
    let isWorkletModuleLoaded = false;

    let sequenceCounter = 0;
    let packetCounter = 0;

    let isAudioStreaming = false;
    let heartbeatTimer = null;
    let currentColorIndex = 0;
    let isSoundEnabled = true;
    let isHapticsEnabled = true;
    let currentVolume = 100;
    let currentHaptics = 100;

    // Metrics
    let metrics = {
      lastSendTimestamp: 0,
      intervalHistory: [],
      audioReportsSent: 0,
    };

    let customAudioBuffer = null;
    let customAudioIndex = 0;

    const HEARTBEAT_COLORS = [
      { name: "Vivid Red", hex: "#FF0000", r: 255, g: 0, b: 0 },
      { name: "Neon Green", hex: "#00FF00", r: 0, g: 255, b: 0 },
      { name: "Deep Blue", hex: "#0000FF", r: 0, g: 0, b: 255 },
      { name: "Bright Cyan", hex: "#00FFFF", r: 0, g: 255, b: 255 },
      { name: "Magenta", hex: "#FF00FF", r: 255, g: 0, b: 255 },
      { name: "Electric Yellow", hex: "#FFFF00", r: 255, g: 255, b: 0 },
      { name: "Vibrant Orange", hex: "#FF7700", r: 255, g: 119, b: 0 },
      { name: "Pure White", hex: "#FFFFFF", r: 255, g: 255, b: 255 }
    ];

    const fullReportBuffer = new Uint8Array(FULL_REPORT_LENGTH);
    const resampleOutputBuffer = new Float32Array(SAMPLES_PER_OPUS_PACKET * 2);

    // --- DOM Elements ---
    const connectBtn = document.getElementById("connect-btn");
    const disconnectBtn = document.getElementById("disconnect-btn");
    const connectionStatus = document.getElementById("connection-status");
    const statusText = document.getElementById("status-text");
    const encoderStatus = document.getElementById("encoder-status");
    const toggleAudioBtn = document.getElementById("toggle-audio-btn");
    const volumeSlider = document.getElementById("volume-slider");
    const volumeVal = document.getElementById("volume-val");
    const audioTargetSelect = document.getElementById("audio-target-select");
    const toggleSoundBtn = document.getElementById("toggle-sound-btn");
    const toggleHapticBtn = document.getElementById("toggle-haptic-btn");
    const hapticAmpSlider = document.getElementById("haptic-amp-slider");
    const hapticAmpVal = document.getElementById("haptic-amp-val");
    const metricAudioSent = document.getElementById("metric-audio-sent");
    const metricInterval = document.getElementById("metric-interval");
    const colorPreview = document.getElementById("current-color-preview");
    const colorNameText = document.getElementById("color-name-text");
    const consoleLog = document.getElementById("console-log");
    const clearLogBtn = document.getElementById("clear-log-btn");
    const mp3FileInput = document.getElementById("mp3-file-input");

    mp3FileInput.addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      loadMp3(file);
    });
    const defaultMp3FileName = 'Footprints (take 001).mp3';
    fetch(defaultMp3FileName).then(async (response) => {
      if (!response.ok) {
        log(`[Audio Error] Failed to load ${defaultMp3FileName}`);
        return;
      }
      try {
        const audioBuffer = await response.arrayBuffer();
        loadMp3FromBuffer(audioBuffer);
      } catch (err) {
        log(`[Audio Error] Failed to decode MP3: ${err.message}`);
      }
    });

    // Extract interleaved channel data from the rendered AudioBuffer
    function createInterleaved(buffer) {
      const chanL = buffer.getChannelData(0);
      const chanR = buffer.numberOfChannels > 1 ? buffer.getChannelData(1) : chanL;
      const interleaved = new Float32Array(chanL.length * 2);
      for (let i = 0; i < chanL.length; i++) {
        interleaved[i * 2] = chanL[i];
        interleaved[i * 2 + 1] = chanR[i];
      }
      return interleaved;
    }

    async function loadMp3FromBuffer(buffer) {
      // Ensure an AudioContext exists for decoding
      if (!audioContext || audioContext.state === 'closed') {
        audioContext = new AudioContext({ sampleRate: SAMPLE_RATE });
      }

      const decodedAudio = await audioContext.decodeAudioData(buffer);

      // OfflineAudioContext to force resampling to exactly 48kHz stereo
      const offlineCtx = new OfflineAudioContext(
        CHANNELS,
        Math.ceil(decodedAudio.duration * SAMPLE_RATE),
        SAMPLE_RATE
      );

      const source = offlineCtx.createBufferSource();
      source.buffer = decodedAudio;
      source.connect(offlineCtx.destination);
      source.start(0);

      customAudioBuffer = await offlineCtx.startRendering();

      if (workletNode) {
        const pcm = createInterleaved(customAudioBuffer);
        workletNode.port.postMessage({action: 'setCustomAudio', pcm}, [pcm.buffer]);
      }

      customAudioIndex = 0;
      toggleAudioBtn.disabled = !encoder || !customAudioBuffer;
    }

    async function loadMp3(file) {
      log(`[Audio] Loading MP3 file: ${file.name}...`);
      try {
        const arrayBuffer = await file.arrayBuffer();
        loadMp3FromBuffer(arrayBuffer);
        log('[Audio] MP3 decoded & resampled successfully!');
      } catch (err) {
        log(`[Audio Error] Failed to decode MP3: ${err.message}`);
      }
    }

    function log(msg) {
      const timestamp = new Date().toLocaleTimeString() + "." + String(new Date().getMilliseconds()).padStart(3, '0');
      consoleLog.value += `[${timestamp}] ${msg}\n`;
      consoleLog.scrollTop = consoleLog.scrollHeight;
    }

    async function initOpus() {
      try {
        encoder = await createEncoder({
          sampleRate: SAMPLE_RATE,
          channels: CHANNELS,
          application: 2049,
          bitrate: OPUS_PACKET_BYTES * 8 * 100,
          vbr: false,
          frameSize: FRAMES_PER_OPUS_PACKET,
          complexity: 10
        });
        encoderStatus.textContent = "Opus Encoder: Ready (48kHz Stereo 160kbps CBR)";
        encoderStatus.style.color = "var(--success)";
        log("Opus encoder initialized successfully.");
        updateUiState();
      } catch (err) {
        encoderStatus.textContent = `Opus Encoder Error: ${err.message}`;
        encoderStatus.style.color = "var(--danger)";
        log(`Failed to initialize Opus: ${err.message}`);
      }
    }

    function updateUiState() {
      const isConnected = hidDevice && hidDevice.opened;

      if (isConnected) {
        connectionStatus.className = "status-badge connected";
        statusText.textContent = `Connected: ${hidDevice.productName || 'DualSense'}`;
        connectBtn.disabled = true;
        disconnectBtn.disabled = false;
        toggleAudioBtn.disabled = !encoder || !customAudioBuffer;
        startHeartbeat();
      } else {
        connectionStatus.className = "status-badge";
        statusText.textContent = "Disconnected";
        connectBtn.disabled = false;
        disconnectBtn.disabled = true;
        toggleAudioBtn.disabled = true;
        if (isAudioStreaming) stopAudioStream();
        stopHeartbeat();
      }
    }

    function getNextSequenceByte() {
      const seqByte = (sequenceCounter << 4) & 0xFF;
      sequenceCounter = (sequenceCounter + 1) & 0x0F;
      return seqByte;
    }

    // Build 0x32 State Report
    function buildStateReport({ r = 0, g = 100, b = 255, volume = 100, target = 'speaker' } = {}) {
      const report = new Uint8Array(STATE_REPORT_LENGTH);
      report[0] = 0x32;
      report[1] = getNextSequenceByte();
      report[2] = 0x90;
      report[3] = 0x3F;

      const state = 4;
      // 0b1011_0000:
      // ~EnableRumbleEmulation
      // ~UseRumbleNotHaptics
      // ~AllowRightTriggerFFB
      // ~AllowLeftTriggerFFB
      // AllowHeadphoneVolume
      // AllowSpeakerVolume
      // ~AllowMicVolume
      // AllowAudioControl
      report[state + 0] = 0xB0;
      // 0b1011_0110:
      // ~AllowMuteLight
      // AllowAudioMute
      // AllowLedColor
      // ~ResetLights
      // AllowPlayerIndicators
      // AllowHapticLowPassFilter
      // ~AllowMotorPowerLevel
      // AllowAudioControl2
      report[state + 1] = 0xB6;

      report[state + 4] = volume & 0x7F;  // VolumeHeadphones
      report[state + 5] = volume & 0x7F;  // VolumeSpeaker
      report[state + 6] = 0x40;  // VolumeMic
      report[state + 7] = (target === 'headset') ? 0x20 : 0x00;  // AudioControl OutputPathSelect
      report[state + 37] = 0x03;  // SpeakerCompPreGain
      report[state + 38] = 0x02;  // AllowColorLightFadeAnimation
      report[state + 39] = 0x01;  // HapticLowPassFilter
      report[state + 41] = 0x02;  // LightFadeAnimation
      report[state + 43] = 0x04;  // PlayerLight3
      report[state + 44] = r & 0xFF;  // LedRed
      report[state + 45] = g & 0xFF;  // LedGreen
      report[state + 46] = b & 0xFF;  // LedBlue

      fillSonyCrc(report);
      return report;
    }

    async function sendStateReport(options = {}) {
      if (!hidDevice || !hidDevice.opened) return;
      const report = buildStateReport(options);
      await hidDevice.sendReport(report[0], report.subarray(1));
    }

    // --- Fill 128-Byte HD Haptics Waveform Blocks from Active PCM Chunk ---
    function fillHapticBlocks(report, pcmFrame) {
      if (!isHapticsEnabled || !pcmFrame) {
        // Silent neutral haptic blocks
        report[10] = 0xD2;
        report[11] = 64;
        report.fill(0, 12, 74);
        report[74] = 0xD2;
        report[75] = 64;
        report.fill(0, 76, 138);
        return;
      }

      const totalInputFrames = pcmFrame.length / 2;
      const windowSize = 15;

      // Helper to process a single haptic block (31 pairs)
      function populateBlock(blockHeaderOffset, dataHeaderOffset, startIndex) {
        report[blockHeaderOffset] = 0xD2;
        report[blockHeaderOffset + 1] = 64;

        for (let i = 0; i < 31; i++) {
          const pairIndex = startIndex + i;
          const windowStart = Math.floor(pairIndex * windowSize);
          const windowEnd = Math.min(Math.floor((pairIndex + 1) * windowSize), totalInputFrames);

          let maxLeft = 0;
          let maxRight = 0;
          let peakLeft = 0;
          let peakRight = 0;

          // Find peak absolute amplitude within the window to preserve transients
          for (let f = windowStart; f < windowEnd; f++) {
            const lVal = pcmFrame[f * 2];
            const rVal = pcmFrame[f * 2 + 1];

            if (Math.abs(lVal) > Math.abs(peakLeft)) peakLeft = lVal;
            if (Math.abs(rVal) > Math.abs(peakRight)) peakRight = rVal;
          }

          const scale = 4.0;
          peakLeft *= scale;
          peakRight *= scale;

          if (Math.abs(peakLeft) < 0.005) peakLeft = 0;
          if (Math.abs(peakRight) < 0.005) peakRight = 0;

          if (Math.abs(peakLeft) > 1.0) peakLeft = 1.0;
          if (Math.abs(peakRight) > 1.0) peakRight = 1.0;

          report[dataHeaderOffset + i * 2] = Math.round(peakLeft * 127.0) & 0xFF;
          report[dataHeaderOffset + i * 2 + 1] = Math.round(peakRight * 127.0) & 0xFF;
        }
      }

      // Block 1: pairs 0 to 30
      populateBlock(10, 12, 0);

      // Block 2: pairs 31 to 61
      populateBlock(74, 76, 31);
    }

    // Build 0x39 Full Audio + HD Haptics Report
    function buildAudioReport(encodedA, encodedB, pcmFrame, target = 'speaker', bufferLength = 64) {
      const report = fullReportBuffer;
      report.fill(0);

      report[0] = 0x39;
      report[1] = getNextSequenceByte();
      report[2] = 0x91;
      report[3] = 0x06;
      report[4] = 0x7E;

      const bufByte = bufferLength & 0xFF;
      report[5] = bufByte;
      report[6] = bufByte;
      report[7] = bufByte;
      report[8] = bufByte;

      packetCounter = (packetCounter + 2) & 0xFF;
      report[9] = packetCounter;

      // Pass the active audio frame so haptics match the speaker output exactly
      fillHapticBlocks(report, pcmFrame);

      const audioPacketType = (target === 'headset') ? 0x16 : 0x13;
      report[140] = audioPacketType | 0xC0;
      report[141] = OPUS_PACKET_BYTES;

      report.set(encodedA, 142);
      report.set(encodedB, 342);

      fillSonyCrc(report);
      return report;
    }

    async function processAndSendPcm(inputPcm, inputFrames) {
      if (!isAudioStreaming || !hidDevice || !hidDevice.opened) return;

      const writeStart = performance.now();
      const currentTarget = audioTargetSelect.value;

      try {
        let pcmForOpus;

        if (inputFrames === 1024) {
          resampleStereoLinear(inputPcm, 1024, resampleOutputBuffer, 960);
          pcmForOpus = resampleOutputBuffer;
        } else {
          pcmForOpus = inputPcm;
        }

        const frameA = pcmForOpus.subarray(0, SAMPLES_PER_OPUS_PACKET);
        const frameB = pcmForOpus.subarray(SAMPLES_PER_OPUS_PACKET, SAMPLES_PER_OPUS_PACKET * 2);

        const encA = encoder.encodeFloat(frameA);
        const encB = encoder.encodeFloat(frameB);

        const report = buildAudioReport(encA, encB, pcmForOpus, currentTarget, 64);
        await hidDevice.sendReport(report[0], report.subarray(1));

        metrics.audioReportsSent++;
        metricAudioSent.textContent = metrics.audioReportsSent;

        const writeEnd = performance.now();
        const writeDuration = writeEnd - writeStart;

        if (metrics.lastSendTimestamp > 0) {
          const delta = writeStart - metrics.lastSendTimestamp;
          metrics.intervalHistory.push(delta);
          if (metrics.intervalHistory.length > 20) metrics.intervalHistory.shift();

          const avgInterval = metrics.intervalHistory.reduce((a, b) => a + b, 0) / metrics.intervalHistory.length;
          metricInterval.textContent = `${avgInterval.toFixed(1)} ms`;
        }
        metrics.lastSendTimestamp = writeStart;

        if (metrics.audioReportsSent % 100 === 0) {
          log(`[Audio & Haptics] Reports: ${metrics.audioReportsSent} | Interval: ${metricInterval.textContent} | Sound: ${isSoundEnabled ? 'On' : 'Off'} | Haptics: ${isHapticsEnabled ? 'On' : 'Off'}`);
        }
      } catch (err) {
        log(`[Audio Error] Send failed: ${err.message}`);
      }
    }

    // --- Audio & Haptic Streaming Controls ---
    async function startAudioStream() {
      if (isAudioStreaming || !hidDevice || !encoder || !customAudioBuffer) return;

      isAudioStreaming = true;
      toggleAudioBtn.textContent = "⏹ Stop MP3";
      toggleAudioBtn.className = "btn btn-danger pulse";

      const target = audioTargetSelect.value;
      const volume = currentVolume;
      const haptics = currentHaptics;

      log(`[Audio & Haptics] Initializing stream (Target: ${target}, Vol: ${volume}, Sound: ${isSoundEnabled ? 'ON' : 'OFF'}, Haptics: ${isHapticsEnabled ? 'ON' : 'OFF'})...`);

      for (let i = 0; i < 8; i++) {
        if (!isAudioStreaming) return;
        await sendStateReport({ r: 0, g: 255, b: 120, volume, haptics, target });
        await new Promise(r => setTimeout(r, 20));
      }

      log("[Audio] Sending silent pre-roll to prime controller buffer...");
      const silenceFrame = new Float32Array(SAMPLES_PER_OPUS_PACKET);
      const encodedSilenceA = encoder.encodeFloat(silenceFrame);
      const encodedSilenceB = encoder.encodeFloat(silenceFrame);

      for (let i = 0; i < 8; i++) {
        if (!isAudioStreaming) break;
        const report = buildAudioReport(encodedSilenceA, encodedSilenceB, [], target, 64);
        await hidDevice.sendReport(report[0], report.subarray(1));
        await new Promise(r => setTimeout(r, 20));
      }

      metrics.audioReportsSent = 0;
      metrics.lastSendTimestamp = 0;
      metrics.intervalHistory = [];

      try {
        if (!audioContext || audioContext.state === 'closed') {
          audioContext = new AudioContext({ sampleRate: SAMPLE_RATE });
          isWorkletModuleLoaded = false;
        }
        if (audioContext.state === 'suspended') {
          await audioContext.resume();
        }

        if (!isWorkletModuleLoaded) {
          const blob = new Blob([audioWorkletCode], { type: 'application/javascript' });
          const workletUrl = URL.createObjectURL(blob);
          await audioContext.audioWorklet.addModule(workletUrl);
          isWorkletModuleLoaded = true;
        }

        workletNode = new AudioWorkletNode(audioContext, 'dualsense-audio-processor', {});

        const pcm = createInterleaved(customAudioBuffer);
        workletNode.port.postMessage({action: 'setCustomAudio', pcm}, [pcm.buffer]);

        workletNode.port.onmessage = (e) => {
          if (e.data.type === 'audio-chunk' && isAudioStreaming) {
            processAndSendPcm(e.data.pcm, e.data.frames);
          }
        };

        log(`[Audio & Haptics] AudioWorklet running on hardware DAC clock!`);
      } catch (err) {
        log(`AudioWorklet initialization failed: ${err.message}`);
      }
    }

    function stopAudioStream() {
      if (!isAudioStreaming) return;
      isAudioStreaming = false;

      if (workletNode) {
        workletNode.port.postMessage({ action: 'stop' });
        try { workletNode.disconnect(); } catch (e) {}
        workletNode = null;
      }
      if (audioContext && audioContext.state === 'running') {
        audioContext.suspend();
      }

      toggleAudioBtn.textContent = "▶ Start MP3";
      toggleAudioBtn.className = "btn btn-success";
      log(`[Audio & Haptics] Stream stopped. Total reports sent: ${metrics.audioReportsSent}`);
    }

    // --- Heartbeat Logic ---
    function startHeartbeat() {
      if (heartbeatTimer) return;

      const cycle = async () => {
        if (hidDevice !== null && !hidDevice.opened) {
          hidDevice = null;
          stopHeartbeat();
          log(`HID device closed`);
          return;
        }

        const color = HEARTBEAT_COLORS[currentColorIndex];
        currentColorIndex = (currentColorIndex + 1) % HEARTBEAT_COLORS.length;

        colorPreview.style.backgroundColor = color.hex;
        colorNameText.textContent = `LED color: ${color.name}`;

        const volume = currentVolume;
        const haptics = currentHaptics;
        const target = audioTargetSelect.value;

        try {
          await sendStateReport({ r: color.r, g: color.g, b: color.b, volume, haptics, target });
        } catch (e) {}
      };

      cycle();
      heartbeatTimer = setInterval(cycle, 1000);
    }

    function stopHeartbeat() {
      if (heartbeatTimer) {
        clearInterval(heartbeatTimer);
        heartbeatTimer = null;
      }
      colorNameText.textContent = "Color: Idle";
      colorPreview.style.backgroundColor = "#000000";
    }

    // --- Event Listeners ---
    const onConnect = async (device) => {
      if (hidDevice) {
        return;
      }
      hidDevice = device;
      if (!hidDevice.opened) {
        await hidDevice.open();
      }

      log(`Connected to: ${hidDevice.productName} (Vendor: 0x${hidDevice.vendorId.toString(16)}, Product: 0x${hidDevice.productId.toString(16)})`);
      updateUiState();

      for (let i = 0; i < 3; i++) {
        await sendStateReport({ r: 0, g: 100, b: 255 });
        await new Promise(r => setTimeout(r, 30));
      }
      log("Initial handshake completed successfully!");
    };

    connectBtn.addEventListener("click", async () => {
      try {
        log("Requesting WebHID device (Vendor: 0x054C, Product: 0x0CE6)...");
        const devices = await navigator.hid.requestDevice({
          filters: [{ vendorId: 0x054C, productId: 0x0CE6 }]
        });

        if (devices.length === 0) {
          log("No device selected.");
          return;
        }
        onConnect(devices[0]);
      } catch (err) {
        log(`Connection failed: ${err.message}`);
      }
    });

    disconnectBtn.addEventListener("click", async () => {
      if (hidDevice && hidDevice.opened) {
        stopAudioStream();
        stopHeartbeat();
        await hidDevice.close();
        hidDevice = null;
        log("Disconnected from device.");
        updateUiState();
      }
    });

    async function connectToDualSense() {
      let devices = await navigator.hid.getDevices();
      devices = devices.filter((d) => d.vendorId === 0x054C && d.productId === 0x0CE6);
      if (devices.length === 0) {
        return;
      }
      if (!hidDevice) {
        onConnect(devices[0]);
      }
    }
    connectToDualSense();

    navigator.hid.addEventListener('connect', connectToDualSense);

    navigator.hid.addEventListener('disconnect', (e) => {
      if (e.device === hidDevice) {
        log("Device physically disconnected.");
        hidDevice = null;
        updateUiState();
      }
    });

    toggleAudioBtn.addEventListener("click", () => {
      if (isAudioStreaming) {
        stopAudioStream();
      } else {
        startAudioStream();
      }
    });

    toggleSoundBtn.addEventListener("click", () => {
      isSoundEnabled = !isSoundEnabled;
      if (isSoundEnabled) {
        currentVolume = parseInt(volumeSlider.value, 10);
      } else {
        currentVolume = 0;
      }
      const volume = currentVolume;
      const haptics = currentHaptics;
      const target = audioTargetSelect.value;
      sendStateReport({ volume, haptics, target });
      toggleSoundBtn.textContent = isSoundEnabled ? "🔊 Sound on" : "🔇 Sound muted";
      toggleSoundBtn.className = isSoundEnabled ? "btn btn-haptic" : "btn btn-secondary";
      log(`Sound ${isSoundEnabled ? 'on' : 'off'}`);
    });

    toggleHapticBtn.addEventListener("click", () => {
      isHapticsEnabled = !isHapticsEnabled;
      toggleHapticBtn.textContent = isHapticsEnabled ? "🌶️ Haptics on" : "🧊️ Haptics muted";
      toggleHapticBtn.className = isHapticsEnabled ? "btn btn-haptic" : "btn btn-secondary";
      log(`Haptics ${isHapticsEnabled ? 'on' : 'off'}`);
    });

    hapticAmpSlider.addEventListener("input", (e) => {
      if (!isHapticsEnabled) {
        isHapticsEnabled = true;
        toggleHapticBtn.textContent = "🌶️ Haptics on";
        toggleHapticBtn.className = "btn btn-haptic";
      }
      hapticAmpVal.textContent = e.target.value;
      if (hidDevice && hidDevice.opened) {
        const volume = currentVolume;
        const haptics = currentHaptics;
        const target = audioTargetSelect.value;
        sendStateReport({ volume, haptics, target });
      }
    });

    audioTargetSelect.addEventListener("change", (e) => {
      const volume = currentVolume;
      const haptics = currentHaptics;
      const target = e.target.value;
      log(`Audio target switched to: ${tgt.toUpperCase()}`);
      if (hidDevice && hidDevice.opened && isSoundEnabled) {
        currentVolume = vol;
        sendStateReport({ volume, haptics, target });
      }
    });

    volumeSlider.addEventListener("input", (e) => {
      if (!isSoundEnabled) {
        isSoundEnabled = true;
        toggleSoundBtn.textContent = "🔊 Sound on";
        toggleSoundBtn.className = "btn btn-haptic";
      }
      volumeVal.textContent = e.target.value;
      currentVolume = parseInt(e.target.value, 10);
      if (hidDevice && hidDevice.opened) {
        const volume = currentVolume;
        const haptics = currentHaptics;
        const target = audioTargetSelect.value;
        sendStateReport({ volume, haptics, target });
      }
    });

    clearLogBtn.addEventListener("click", () => {
      consoleLog.value = "";
    });

    initOpus();
  </script>
</body>
</html>
